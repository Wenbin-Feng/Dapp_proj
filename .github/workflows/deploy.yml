name: Deploy production

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/ci.yml
    with:
      check-build: false

  configuration:
    name: Check deployment configuration
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check required GitHub secrets
        id: configuration
        shell: bash
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped: configure GitHub repository secrets: ${missing[*]}. Application checks still run."
            {
              echo '### Production deployment skipped'
              echo
              echo "Missing GitHub repository secrets: ${missing[*]}."
              echo 'Application checks still run. No deployment has been created.'
              echo 'After configuring Vercel and the secrets, run this workflow again on the release branch.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy release to Vercel
    needs:
      - validate
      - configuration
    if: github.ref == 'refs/heads/release' && needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@64.0.2

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Configure deployed Sepolia contracts
        env:
          PRODUCT_BACKEND: ${{ vars.PRODUCT_BACKEND || 'database' }}
        run: node scripts/prepare-demo-production.mjs

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --no-wait --token="$VERCEL_TOKEN" \
            --env "DEMO_DEPLOYMENT=$DEMO_DEPLOYMENT" \
            --env "DEMO_PUBLIC_RPC_URL=$DEMO_PUBLIC_RPC_URL" \
            --env "PRODUCT_BACKEND=$PRODUCT_BACKEND")"
          {
            echo '### Production deployment submitted'
            echo
            echo "Deployment: $deployment_url"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/wait-for-vercel.mjs "$deployment_url"
