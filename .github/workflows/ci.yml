name: CI

on:
  push:
    branches-ignore:
      - release
  pull_request:
    branches:
      - main
      - release
  workflow_call:
    inputs:
      check-build:
        description: Build Next.js after the application checks.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_only
      SUPABASE_STORAGE_BUCKET: dapp
      NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: dapp
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and database tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Check production build
        # Direct push/PR events have no inputs; reusable callers may disable it.
        if: ${{ !contains(toJSON(inputs), '"check-build"') || inputs['check-build'] }}
        run: npm run build

      - name: Upload failed browser checks
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
