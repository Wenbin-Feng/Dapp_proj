name: Sync product events
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-product-index
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reconcile canonical product events
        env:
          DEMO_INDEXER_TOKEN: ${{ secrets.DEMO_INDEXER_TOKEN }}
          DEMO_APP_URL: ${{ vars.DEMO_APP_URL }}
        run: node scripts/sync-products.mjs
